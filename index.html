<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kids English Word Trainer</title>
    <link rel="stylesheet" href="src/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-nav" aria-label="メインメニュー">
        <div>
          <p class="app-kicker">Kids English</p>
          <h1>Word Trainer</h1>
        </div>
        <nav>
          <button class="nav-button active" data-view="home">ホーム</button>
          <button class="nav-button" data-view="study">学習</button>
          <button class="nav-button" data-view="test">テスト</button>
          <button class="nav-button" data-view="records">学習記録</button>
          <button class="nav-button" data-view="words">単語管理</button>
        </nav>
      </aside>

      <main class="main-content">
        <section id="home-view" class="view active" aria-labelledby="home-title">
          <div class="page-heading">
            <div>
              <p class="eyebrow">今日の学習</p>
              <h2 id="home-title">学習状況</h2>
            </div>
          </div>
          <div class="status-grid" id="home-status"></div>
          <div class="action-row">
            <button id="start-study-button" class="primary-button">単語を学習する</button>
            <button id="start-test-button" class="secondary-button">テスト開始</button>
            <button id="review-button" class="secondary-button">復習する</button>
          </div>
          <p id="home-message" class="message" role="status"></p>
          <form id="home-settings-form" class="settings-form compact-settings">
            <div class="form-header-action">
              <h3>学習設定</h3>
              <button class="primary-button" type="submit">保存</button>
            </div>
            <label>
              学習モード
              <select name="learningMode">
                <option value="weekly">毎週</option>
                <option value="daily">毎日</option>
              </select>
            </label>
            <label>
              1回の単語数
              <input name="wordCount" type="number" min="1" max="50" />
            </label>
            <label>
              学年
              <select name="gradeLevel">
                <option value="1">小学1年生</option>
                <option value="2">小学2年生</option>
                <option value="3">小学3年生</option>
                <option value="4">小学4年生</option>
                <option value="5">小学5年生</option>
                <option value="6">小学6年生</option>
              </select>
            </label>
            <label>
              カテゴリ
              <select name="categoryMode">
                <option value="random">ランダム</option>
                <option value="selected">指定カテゴリ</option>
              </select>
            </label>
            <fieldset>
              <legend>カテゴリ選択</legend>
              <div id="home-category-options" class="chip-grid"></div>
            </fieldset>
            <label>
              合格基準
              <input name="passThresholdRate" type="number" min="1" max="100" />
            </label>
            <label>
              再出題停止期間
              <input name="cooldownDays" type="number" min="1" max="365" />
            </label>
            <label>
              テスト形式
              <select name="testFormat">
                <option value="en_to_ja">英語→日本語</option>
                <option value="ja_to_en">日本語→英語</option>
                <option value="mixed">ミックス</option>
              </select>
            </label>
          </form>
        </section>

        <section id="study-view" class="view" aria-labelledby="study-title">
          <div class="page-heading">
            <div>
              <p class="eyebrow">単語学習</p>
              <h2 id="study-title">今日覚える単語</h2>
            </div>
            <p id="study-counter" class="counter"></p>
          </div>
          <article id="word-card" class="word-card"></article>
          <div class="action-row">
            <button id="remember-button" class="primary-button">覚えた</button>
            <button id="next-word-button" class="secondary-button">次へ</button>
            <button id="show-word-list-button" class="secondary-button">学習単語の一覧</button>
          </div>
        </section>

        <section id="test-view" class="view" aria-labelledby="test-title">
          <div class="page-heading">
            <div>
              <p class="eyebrow">確認テスト</p>
              <h2 id="test-title">定着度チェック</h2>
            </div>
            <p id="test-counter" class="counter"></p>
          </div>
          <div id="test-panel" class="test-panel"></div>
          <div class="action-row">
            <button id="answer-button" class="primary-button">回答する</button>
            <button id="next-question-button" class="secondary-button hidden" disabled>次へ</button>
          </div>
        </section>

        <section id="result-view" class="view" aria-labelledby="result-title">
          <div class="page-heading">
            <div>
              <p class="eyebrow">テスト結果</p>
              <h2 id="result-title">結果</h2>
            </div>
          </div>
          <div id="result-panel" class="result-panel"></div>
          <div class="action-row">
            <button id="review-mistakes-button" class="primary-button">間違えた単語を復習する</button>
            <button id="next-learning-button" class="secondary-button">次の学習へ</button>
          </div>
        </section>

        <section id="records-view" class="view" aria-labelledby="records-title">
          <div class="page-heading">
            <div>
              <p class="eyebrow">学習ログ</p>
              <h2 id="records-title">学習記録</h2>
            </div>
            <button id="export-records-csv-button" class="secondary-button" type="button">CSVを書き出し</button>
          </div>
          <div class="record-summary" id="record-summary"></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>日付</th>
                  <th>種別</th>
                  <th>モード</th>
                  <th>単語数</th>
                  <th>カテゴリ</th>
                  <th>点数</th>
                  <th>単語</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="record-table-body"></tbody>
            </table>
          </div>
        </section>

        <section id="words-view" class="view" aria-labelledby="words-title">
          <div class="page-heading">
            <div>
              <p class="eyebrow">データ管理</p>
              <h2 id="words-title">単語一覧</h2>
            </div>
            <label class="file-button">
              JSON / Excel インポート
              <input id="import-file" type="file" accept=".json,.csv,.xlsx,.xls" />
            </label>
          </div>
          <p id="word-count-label" class="word-count-label"></p>
          <div class="data-actions">
            <a class="secondary-link" href="templates/word-template.json" download>単語JSONテンプレート</a>
            <a class="secondary-link" href="templates/word-template.csv" download>単語CSVテンプレート</a>
          </div>
          <form id="word-form" class="word-form">
            <input name="english" placeholder="英単語" required />
            <input name="japanese" placeholder="日本語" required />
            <select name="gradeLevel"></select>
            <select name="categoryId"></select>
            <button class="secondary-button" type="submit">単語を追加</button>
          </form>
          <p id="import-message" class="message" role="status"></p>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>英単語</th>
                  <th>日本語</th>
                  <th>学年</th>
                  <th>カテゴリ</th>
                  <th>状態</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="word-table-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <dialog id="word-list-dialog" class="word-list-dialog">
      <div class="dialog-heading">
        <h2>学習単語の一覧</h2>
        <button id="close-word-list-button" class="secondary-button" type="button">閉じる</button>
      </div>
      <div id="word-list-panel" class="word-list-panel"></div>
    </dialog>

    <script src="src/core.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
